<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PNB Housing Finance Limited | Home Ground Check</title>
  <link rel="icon" type="image/png" href="https://www.pnbhousing.com/documents/20120/217928/Favicon1/b23d48fc-bcaf-964a-b989-77cefe1abd9f" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Montserrat:wght@500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #030d14;
      --text: #f6fbff;
      --muted: #b4cbdb;
      --gold: #facc15;
      --teal: #22d3ee;
      --green: #22c55e;
      --orange: #fb923c;
      --border: rgba(255, 255, 255, 0.16);
      --glass: rgba(255, 255, 255, 0.08);
      --shadow: 0 22px 70px rgba(0, 0, 0, 0.45);
      --theme-a: #22d3ee;
      --theme-b: #facc15;
      --theme-c: #fb923c;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; min-height: 100%; }
    html {
      overflow-x: hidden;
      max-width: 100%;
    }
    body {
      font-family: "Outfit", sans-serif;
      color: var(--text);
      background: var(--bg);
      min-height: 100vh;
      overflow-x: hidden;
      overflow-y: auto;
      max-width: 100%;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    body.is-landing .page-bg {
      visibility: hidden;
      pointer-events: none;
    }
    body.is-landing .stadium-lights,
    body.is-landing .stadium-crowd-bg {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    body:not(.is-landing) .stadium-crowd-bg {
      visibility: visible;
    }
    body.is-landing .wrap {
      max-width: none;
      width: 100%;
      padding: 0 0 12px;
      margin: 0;
    }
    body.is-landing .screen.screen--landing {
      min-height: 100vh;
      min-height: 100dvh;
      max-height: none;
    }
    body.is-landing .sound-toggle {
      bottom: 20px;
    }
    @media (max-width: 1024px) {
      body.is-landing .sound-toggle {
        bottom: 16px;
        right: 10px;
      }
    }

    .home-landing {
      position: relative;
      width: 100%;
      min-height: min(100dvh, 100vh);
      margin: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      box-shadow: none;
      background-color: #0a1620;
      background-image: url("https://prod-cdp-assets.rebid.co/2196/fb6eb31d-127c-441c-81b9-1ad0ce7c19e3.png");
      background-position: center center;
      background-size: 100% 100%;
      background-repeat: no-repeat;
      overflow: hidden;
    }
    @media (max-width: 1024px) {
      .home-landing {
        background-image: url("https://prod-cdp-assets.rebid.co/2196/118b2af3-fada-4402-a1b5-5cfded070e4c.png");
      }
    }
    .home-cta {
      position: absolute;
      right: clamp(16px, 5vw, 90px);
      bottom: clamp(18px, 11vh, 90px);
      margin: 0;
      padding: 0;
      border: 0;
      background: none;
      cursor: pointer;
      line-height: 0;
      z-index: 4;
      overflow: visible;
      border-radius: 0;
      isolation: isolate;
      box-shadow: none;
      transition: filter 0.2s ease;
    }
    /* Lub–dub pulse — no box/drop shadows (avoids rectangular halo behind skewed art) */
    @keyframes homeCtaHeartbeat {
      0%, 100% { transform: scale(1); }
      3% { transform: scale(1.035); }
      7% { transform: scale(1); }
      11% { transform: scale(1.055); }
      17% { transform: scale(1); }
      100% { transform: scale(1); }
    }
    .home-cta:hover .home-cta__art,
    .home-cta:focus-visible .home-cta__art {
      animation-play-state: paused;
      filter: brightness(1.04);
    }
    .home-cta:focus-visible {
      outline: 3px solid #facc15;
      outline-offset: 6px;
      border-radius: 0;
    }
    .home-cta__art {
      position: relative;
      z-index: 0;
      display: block;
      /* vw-based caps shrink the CTA on tablets; use viewport width only as an upper safety bound */
      width: min(420px, 94vw);
      max-width: 100%;
      height: auto;
      object-fit: contain;
      transform-origin: center center;
      filter: none;
      animation: homeCtaHeartbeat 3.1s cubic-bezier(0.45, 0, 0.2, 1) infinite;
    }
    .home-cta__art--mobile {
      display: none;
      width: min(98vw, 448px);
    }
    @media (prefers-reduced-motion: reduce) {
      .home-cta__art {
        animation: none;
        transform: none;
        filter: none;
      }
    }
    @media (max-width: 1024px) {
      .home-cta {
        right: 50%;
        bottom: clamp(20px, 7vh, 52px);
        transform: translateX(50%);
      }
      .home-cta:hover,
      .home-cta:focus-visible {
        transform: translateX(50%);
      }
      .home-cta__art--desktop {
        display: none;
      }
      .home-cta__art--mobile {
        display: block;
      }
    }
    /* Phone / tablet landscape: desktop-style landing (wide art + CTA) so portrait assets are not stretched. */
    body.is-compact-landscape.is-landing .home-landing {
      background-image: url("https://prod-cdp-assets.rebid.co/2196/fb6eb31d-127c-441c-81b9-1ad0ce7c19e3.png");
      /* background-size: cover; */
      background-position: center center;
    }
    body.is-compact-landscape.is-landing .home-cta {
      right: clamp(16px, 8vw, 50px);
      bottom: clamp(18px, 11vh, 72px);
      transform: none;
    }
    body.is-compact-landscape.is-landing .home-cta:hover,
    body.is-compact-landscape.is-landing .home-cta:focus-visible {
      transform: none;
    }
    body.is-compact-landscape.is-landing .home-cta__art--desktop {
      display: block;
    }
    body.is-compact-landscape.is-landing .home-cta__art--mobile {
      display: none;
    }
    body.is-compact-landscape.is-landing .home-cta__art {
      width: min(420px, min(94vw, 52dvh));
      max-width: 100%;
    }
    .page-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      --bg-image: url("https://prod-cdp-assets.rebid.co/2196/6009d397-910c-4306-8c1e-9cf1f11b9d19.png");
      overflow: hidden;
    }
    .page-bg::before {
      content: "";
      position: absolute;
      inset: -2% -6%;
      background: var(--bg-image) center / cover no-repeat;
      transform: translateX(0) scale(1.06);
      will-change: transform;
    }
    .page-bg.bg-motion-landing::before {
      animation: bgPanLanding 30s linear infinite alternate;
    }
    .page-bg.bg-motion-quiz::before {
      animation: bgPanQuiz 24s linear infinite alternate;
    }
    .page-bg.bg-motion-result::before {
      animation: bgPanResult 36s linear infinite alternate;
    }
    @keyframes bgPanLanding {
      0% { transform: translateX(1.5%) scale(1.06); }
      100% { transform: translateX(-4.5%) scale(1.06); }
    }
    @keyframes bgPanQuiz {
      0% { transform: translateX(2%) scale(1.065); }
      100% { transform: translateX(-6%) scale(1.065); }
    }
    @keyframes bgPanResult {
      0% { transform: translateX(1%) scale(1.055); }
      100% { transform: translateX(-3.5%) scale(1.055); }
    }
    .page-bg::after {
      content: "";
      position: absolute;
      inset: 0;
      /* background:
        linear-gradient(180deg, rgba(3, 13, 20, 0.72) 0%, rgba(3, 13, 20, 0.82) 45%, rgba(3, 13, 20, 0.92) 100%),
        radial-gradient(ellipse at 50% 0%, rgba(250, 204, 21, 0.12), transparent 50%); */
      pointer-events: none;
    }
    .stadium-lights {
      position: fixed;
      top: -20vh;
      left: 0;
      right: 0;
      width: 100%;
      max-width: 100%;
      height: 70vh;
      pointer-events: none;
      z-index: 1;
      filter: blur(22px);
      opacity: 0.58;
      background:
        radial-gradient(ellipse at 15% 0%, rgba(250, 204, 21, 0.28), transparent 46%),
        radial-gradient(ellipse at 55% 0%, rgba(34, 211, 238, 0.28), transparent 44%),
        radial-gradient(ellipse at 85% 0%, rgba(251, 146, 60, 0.26), transparent 43%);
      animation: beam 8s ease-in-out infinite alternate;
      transition: opacity .35s ease, filter .35s ease;
    }
    @keyframes beam { to { transform: translateY(20px) scale(1.03); } }
    .noise {
      position: fixed; inset: 0; pointer-events: none; z-index: 2; opacity: 0.05;
      background-image: radial-gradient(#fff 0.4px, transparent 0.4px);
      background-size: 3px 3px;
    }
    .stadium-crowd-bg {
      position: fixed;
      left: 0;
      right: 0;
      width: 100%;
      max-width: 100%;
      transform: none;
      bottom: 0;
      height: 140px;
      z-index: 2;
      pointer-events: none;
      overflow: hidden;
      opacity: 0;
      visibility: hidden;
      filter: saturate(1) brightness(1);
      background: linear-gradient(180deg, rgba(3, 13, 20, 0) 0%, rgba(3, 13, 20, 0.48) 36%, rgba(3, 13, 20, 0.78) 100%);
      transition: opacity .3s ease, filter .3s ease, visibility .3s ease;
    }
    .stadium-crowd-bg.crowd-burst {
      animation: crowdBgBurst 0.38s ease;
    }
    @keyframes crowdBgBurst {
      0%, 100% { filter: saturate(1) brightness(1); }
      50% { filter: saturate(1.18) brightness(1.12); }
    }
    .crowd-row {
      position: absolute;
      left: 0;
      width: 100%;
      display: flex;
      gap: 2px;
      align-items: flex-end;
      justify-content: space-between;
      padding: 0 4px;
    }
    .crowd-row.row-back { bottom: 52px; opacity: 0.4; transform: scaleX(0.92); }
    .crowd-row.row-mid { bottom: 28px; opacity: 0.58; transform: scaleX(0.96); }
    .crowd-row.row-front { bottom: 6px; opacity: 0.8; }
    .crowd-person {
      position: relative;
      display: block;
      flex: 0 0 auto;
      width: var(--fan-width, 8px);
      height: var(--fan-height, 20px);
      --fan-color: #dc2626;
      --fan-head: 4px;
      transform-origin: bottom center;
      animation: crowdWave var(--crowd-wave-duration, 2.8s) ease-in-out infinite;
    }
    .crowd-person::before,
    .crowd-person::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      background: var(--fan-color);
    }
    .crowd-person::before {
      top: 0;
      width: var(--fan-head);
      height: var(--fan-head);
      border-radius: 999px;
      box-shadow: 0 0 3px rgba(250, 204, 21, 0.1);
    }
    .crowd-person::after {
      bottom: 0;
      width: calc(var(--fan-width, 8px) * 0.92);
      height: calc(var(--fan-height, 20px) - var(--fan-head) - 2px);
      border-radius: 7px 7px 2px 2px;
      background: linear-gradient(180deg, rgba(255,255,255,0.08) 0%, var(--fan-color) 35%, var(--fan-color) 100%);
      clip-path: polygon(16% 0, 84% 0, 100% 100%, 0 100%);
    }
    @keyframes crowdWave {
      0%, 100% { transform: scaleY(1) rotate(0deg); }
      30% { transform: scaleY(1.16) rotate(-4deg); }
      60% { transform: scaleY(0.92) rotate(3deg); }
    }
    .wrap {
      position: relative;
      z-index: 3;
      max-width: 1180px;
      margin: 0 auto;
      padding: 8px 12px 28px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .screen {
      margin-top: 0;
      flex: 1;
      min-height: 0;
      max-height: calc(100dvh - 24px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .screen.screen--landing {
      max-height: none;
      min-height: calc(100dvh - 24px);
      align-items: center;
      justify-content: center;
    }
    .screen.screen--result {
      max-height: none;
      align-items: flex-start;
      justify-content: flex-start;
    }
    .screen.screen--quiz {
      justify-content: center;
      padding-top: 4px;
      padding-bottom: 8px;
    }
    .screen.screen--quiz > section {
      max-height: none;
      overflow: visible;
    }
    .screen > section {
      width: 100%;
      max-height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
    }
    .screen.screen--landing > section,
    .screen.screen--result > section {
      max-height: none;
      overflow: visible;
    }
    .screen.screen--landing .card,
    .screen.screen--result .card {
      max-height: none;
      overflow: visible;
    }
    .card {
      border-radius: 20px; padding: 18px; border: 1px solid var(--border);
      background: linear-gradient(140deg, rgba(3, 16, 24, 0.64), rgba(8, 33, 48, 0.36));
      box-shadow: 0 14px 36px rgba(0, 0, 0, 0.34), var(--shadow);
      backdrop-filter: blur(8px);
      overflow-y: auto;
      overflow-x: hidden;
      max-height: 100%;
    }

    .hero {
      position: relative;
      overflow: hidden;
      display: grid;
      gap: 12px;
      background: linear-gradient(140deg, rgba(3, 16, 24, 0.58), rgba(8, 33, 48, 0.34));
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow:
        inset 0 0 0 1px rgba(255, 255, 255, 0.08),
        0 0 0 1px rgba(239, 68, 68, 0.24),
        0 0 22px rgba(239, 68, 68, 0.22);
    }
    .screen.screen--landing .hero {
      overflow: hidden;
    }
    .hero-neon-line {
      position: absolute;
      top: 64px;
      bottom: 54px;
      width: 4px;
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(248, 113, 113, 0.08) 0%, rgba(239, 68, 68, 0.94) 52%, rgba(127, 29, 29, 0.1) 100%);
      box-shadow: 0 0 0 1px rgba(248, 113, 113, 0.22), 0 0 16px rgba(239, 68, 68, 0.68);
      z-index: 3;
      pointer-events: none;
    }
    .hero-neon-line.left { left: 6px; }
    .hero-neon-line.right { right: 6px; }
    .hero-bat-art {
      width: min(100%, 468px);
      max-height: none;
      object-fit: contain;
      margin: 0;
      position: absolute;
      top: 0;
      right: 0;
      pointer-events: none;
      filter: none;
      -webkit-mask-image: radial-gradient(ellipse 78% 66% at 58% 44%, #000 60%, transparent 92%);
      mask-image: radial-gradient(ellipse 78% 66% at 58% 44%, #000 60%, transparent 92%);
      z-index: 4;
    }
    .hero-headline {
      margin: 2px 0 0;
      padding-right: 0;
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(34px, 4.2vw, 56px);
      letter-spacing: 0.04em;
      line-height: 0.92;
      color: #f8fafc;
      text-transform: uppercase;
    }
    .hero-headline span {
      color: var(--gold);
      text-shadow: 0 0 22px rgba(250, 204, 21, 0.33);
    }
    .hero-layout {
      display: grid;
      grid-template-columns: minmax(0, 1.14fr) minmax(0, 0.86fr);
      gap: 8px;
      align-items: stretch;
      position: relative;
      z-index: 2;
    }
    .hero-left,
    .hero-right {
      border: 0;
      background: transparent;
      padding: 10px;
    }
    .hero-left {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      text-align: left;
      justify-content: flex-start;
      gap: 8px;
    }
    .hero-key-art {
      width: min(100%, 372px);
      max-height: 264px;
      object-fit: contain;
      align-self: center;
      filter: drop-shadow(0 10px 26px rgba(0, 0, 0, 0.34));
    }
    .hero-subline {
      margin: 0;
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(24px, 2.45vw, 36px);
      line-height: 0.95;
      letter-spacing: 0.04em;
      color: #f8fafc;
      text-transform: uppercase;
      width: 100%;
      text-align: center;
      /* max-width: 32ch; */
    }
    .hero-subline .accent {
      color: #facc15;
    }
    .cta-row { margin-top: 16px; display: flex; gap: 10px; flex-wrap: wrap; margin-left: auto; margin-right: auto; }
    .btn {
      border: 0; border-radius: 13px; font: inherit; font-weight: 700; padding: 12px 16px; cursor: pointer;
      transition: transform .2s ease, box-shadow .2s ease, opacity .2s ease;
    }
    .btn:hover { transform: translateY(-2px); }
    .btn:disabled { cursor: not-allowed; opacity: 0.55; }
    .btn-primary { color: #041118; background: linear-gradient(110deg, #facc15, #fde68a); box-shadow: 0 9px 24px rgba(250, 204, 21, 0.34); }
    .btn-secondary { color: var(--text); background: rgba(255,255,255,.12); border: 1px solid var(--border); }
    .hero-right {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 10px;
      position: relative;
      z-index: 2;
      padding-top: 160px;
    }
    .hero-score {
      border-radius: 16px; border: 1px solid var(--border);
      background: linear-gradient(145deg, rgba(255,255,255,.1), rgba(255,255,255,.025)); padding: 11px;
      width: 100%;
    }
    .hero-score-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 10px;
      border-bottom: 1px dashed rgba(255, 255, 255, 0.18);
    }
    .hero-score-head span {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #e2e8f0;
      font-weight: 700;
    }
    .hero-score-head b {
      font-family: "Bebas Neue", sans-serif;
      font-size: 24px;
      color: #fef08a;
      letter-spacing: 0.06em;
    }
    .score-row {
      display: grid;
      grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr) minmax(0, 1fr);
      gap: 10px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,.14); color: #d5e6f2;
    }
    .score-row:last-child { border-bottom: none; }
    .score-row span { font-size: 12px; color: #d8e8f5; }
    .score-row b { color: #fff7b2; font-family: "Bebas Neue", sans-serif; font-size: 20px; letter-spacing: 0.03em; font-weight: 400; }
    .journey {
      margin-top: 0;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
      align-items: stretch;
      width: 100%;
      position: relative;
      z-index: 2;
    }
    .journey article {
      border-radius: 12px;
      padding: 12px 10px 10px;
      background: linear-gradient(160deg, rgba(2, 16, 24, 0.88), rgba(3, 20, 34, 0.84));
      border: 1px solid rgba(148, 163, 184, 0.34);
      height: 100%;
      min-height: 98px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      text-align: center;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), inset 0 -14px 26px rgba(2, 6, 23, 0.24);
      transition: none;
    }
    .journey-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      margin-bottom: 0;
      min-height: 0;
    }
    .journey-icon {
      line-height: 1;
      font-size: 16px;
      flex-shrink: 0;
      color: #fde68a;
      filter: drop-shadow(0 0 8px rgba(250, 204, 21, 0.32));
    }
    .journey h4 {
      margin: 0;
      font-family: "Bebas Neue", sans-serif;
      font-size: clamp(17px, 1.35vw, 24px);
      font-weight: 400;
      line-height: 1.3rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      color: #f8fafc;
      text-wrap: balance;
    }
    .journey h4 em {
      font-style: normal;
      color: #fde68a;
    }
    .journey p {
      margin: auto 0 0;
      color: #e2e8f0;
      font-size: 11px;
      line-height: 1.2;
      letter-spacing: 0.02em;
      min-height: 1.2em;
      display: none;
    }
    .hero-live-strip {
      border-radius: 12px;
      border: 1px solid rgba(239, 68, 68, 0.52);
      background:
        linear-gradient(90deg, rgba(127, 29, 29, 0.92) 0%, rgba(185, 28, 28, 0.9) 32%, rgba(220, 38, 38, 0.94) 50%, rgba(185, 28, 28, 0.9) 68%, rgba(127, 29, 29, 0.92) 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.15), 0 8px 24px rgba(127, 29, 29, 0.32);
      overflow: hidden;
      position: relative;
    }
    .hero-live-track {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
      width: max-content;
      padding: 6px 12px;
      animation: heroLiveScroll 18s linear infinite;
    }
    .hero-live-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      border-radius: 999px;
      padding: 2px 9px;
      border: 1px solid rgba(255, 255, 255, 0.32);
      background: rgba(3, 16, 24, 0.42);
      color: #fde68a;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    .hero-live-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #fef2f2;
      box-shadow: 0 0 0 0 rgba(254, 242, 242, 0.5);
      animation: heroLiveBlink 1.1s ease-in-out infinite;
    }
    .hero-live-text {
      color: #ffe6e6;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.05em;

    let pincodeLookupMap = null;
    let pincodeLoadPromise = null;

    function parseCsvLine(line) {
      const out = [];
      let cur = "";
      let inQ = false;
      for (let i = 0; i < line.length; i += 1) {
        const ch = line[i];
        if (ch === '"') {
          if (inQ && line[i + 1] === '"') {
            cur += '"';
            i += 1;
          } else {
            inQ = !inQ;
          }
        } else if (ch === "," && !inQ) {
          out.push(cur.trim());
          cur = "";
        } else if (ch !== "\r") {
          cur += ch;
        }
      }
      out.push(cur.trim());
      return out;
    }

    function buildPincodeLookupMap(csvText) {
      const map = new Map();
      const lines = String(csvText || "")
        .replace(/^\uFEFF/, "")
        .split(/\r?\n/)
        .filter((l) => l.trim().length);
      if (!lines.length) return map;
      const header = parseCsvLine(lines[0]).map((h) => h.trim().toLowerCase());
      const iPin = header.indexOf("pincode");
      const iCity = header.indexOf("city");
      const iState = header.indexOf("state");
      const iDisp = header.indexOf("to display");
      if (iPin < 0 || iCity < 0 || iState < 0) return map;
      for (let r = 1; r < lines.length; r += 1) {
        const cols = parseCsvLine(lines[r]);
        if (cols.length <= Math.max(iPin, iCity, iState)) continue;
        const digits = String(cols[iPin] || "").replace(/\D/g, "");
        if (digits.length !== 6) continue;
        const pin = digits;
        const city = String(cols[iCity] || "").trim();
        const state = String(cols[iState] || "").trim();
        if (!city || !state) continue;
        const display = iDisp >= 0 && cols[iDisp] ? String(cols[iDisp]).trim() : city + ", " + state;
        const rec = { city, state, display };
        if (!map.has(pin)) map.set(pin, []);
        map.get(pin).push(rec);
      }
      return map;
    }

    function ensurePincodeIndex() {
      if (pincodeLookupMap) return Promise.resolve(pincodeLookupMap);
      if (pincodeLoadPromise) return pincodeLoadPromise;
      pincodeLoadPromise = fetch(PINCODE_CSV_URL)
        .then((res) => {
          if (!res.ok) throw new Error("pincode_http_" + res.status);
          return res.text();
        })
        .then((text) => {
          pincodeLookupMap = buildPincodeLookupMap(text);
          return pincodeLookupMap;
        })
        .catch((err) => {
          pincodeLoadPromise = null;
          throw err;
        });
      return pincodeLoadPromise;
    }

    function formatLocationDisplay(raw) {
      return String(raw || "")
        .split(/,\s*/)
        .map((seg) =>
          seg
            .trim()
            .toLowerCase()
            .split(/\s+/)
            .map((w) => (w ? w.charAt(0).toUpperCase() + w.slice(1) : ""))
            .filter(Boolean)
            .join(" ")
        )
        .filter(Boolean)
        .join(", ");
    }

    function inferCityMetroFromPinRow(cityRaw, stateRaw) {
      const c = String(cityRaw || "").toUpperCase();
      const s = String(stateRaw || "").toUpperCase();
      if (
        c.includes("DELHI") ||
        c.includes("GURGAON") ||
        c.includes("GURUGRAM") ||
        c.includes("NOIDA") ||
        c.includes("GHAZIABAD") ||
        c.includes("FARIDABAD") ||
        s.includes("DELHI")
      ) {
        return "Delhi NCR";
      }
      if (c.includes("MUMBAI") || c.includes("THANE") || c.includes("NAVI MUMBAI")) return "Mumbai";
      if (c.includes("PUNE")) return "Pune";
      if (c.includes("BENGALURU") || c.includes("BANGALORE")) return "Bengaluru";
      if (c.includes("CHENNAI")) return "Chennai";
      if (c.includes("AHMEDABAD") || c.includes("GANDHINAGAR")) return "Ahmedabad";
      return "Other city";
    }

    function wireCityPincodeQuestion() {
      const inp = document.getElementById("cityPincode");
      const statusEl = document.getElementById("cityPincodeStatus");
      const multiEl = document.getElementById("cityPincodeMulti");
      const retryBtn = document.getElementById("cityPincodeRetry");
      let deb = null;

      function applyPincodeRow(pinNorm, row) {
        state.answers.pincode = pinNorm;
        state.answers.city = formatLocationDisplay(row.display || row.city + ", " + row.state);
        state.answers.cityMetro = inferCityMetroFromPinRow(row.city, row.state);
      }

      function renderMulti(rows, pinNorm) {
        if (!multiEl) return;
        if (!rows || rows.length < 2) {
          multiEl.innerHTML = "";
          multiEl.hidden = true;
          return;
        }
        multiEl.hidden = false;
        multiEl.innerHTML =
          "<p>Multiple locations match this pincode. Pick yours:</p>" +
          rows
            .map(
              (row, idx) =>
                '<button type="button" class="qn-pincode-opt" data-idx="' +
                idx +
                '">' +
                escapeHtml(formatLocationDisplay(row.display || row.city + ", " + row.state)) +
                "</button>"
            )
            .join("");
        multiEl.querySelectorAll(".qn-pincode-opt").forEach((btn) => {
          btn.addEventListener("click", () => {
            const idx = parseInt(btn.getAttribute("data-idx"), 10);
            if (!Number.isFinite(idx) || !rows[idx]) return;
            applyPincodeRow(pinNorm, rows[idx]);
            renderMulti([], pinNorm);
            if (statusEl) statusEl.textContent = "✓ " + state.answers.city;
            playBatTap();
            refreshQuizAnsweredUI();
          });
        });
      }

      function runLookup(pinRaw) {
        const digits = String(pinRaw || "").replace(/\D/g, "");
        if (digits.length !== 6) {
          state.answers.pincode = digits;
          state.answers.city = "";
          state.answers.cityMetro = "";
          renderMulti([], "");
          if (statusEl) {
            statusEl.textContent =
              digits.length === 0 ? "Enter your 6-digit pincode." : "Enter all 6 digits to look up your city.";
          }
          refreshQuizAnsweredUI();
          return;
        }
        const pin = digits;
        state.answers.pincode = pin;
        if (statusEl) statusEl.textContent = "Looking up pincode…";
        ensurePincodeIndex()
          .then((map) => {
            if (!inp || normalizeSixDigitPinInput(inp.value) !== pin) return;
            const rows = map.get(pin) || [];
            if (rows.length === 0) {
              state.answers.city = "";
              state.answers.cityMetro = "";
              renderMulti([], pin);
              if (statusEl) statusEl.textContent = "Pincode not found. Please check and try again.";
            } else if (rows.length === 1) {
              applyPincodeRow(pin, rows[0]);
              renderMulti([], pin);
              if (statusEl) statusEl.textContent = "✓ " + state.answers.city;
            } else {
              state.answers.city = "";
              state.answers.cityMetro = "";
              if (statusEl) statusEl.textContent = "Multiple areas match — choose your city below.";
              renderMulti(rows, pin);
            }
            refreshQuizAnsweredUI();
          })
          .catch(() => {
            if (statusEl) {
              statusEl.textContent = "Could not load pincode list. Check your connection and tap Retry.";
            }
          });
      }

      if (inp) {
        inp.addEventListener("input", () => {
          if (deb) clearTimeout(deb);
          const v = inp.value;
          const len = v.replace(/\D/g, "").length;
          if (statusEl && len < 6) statusEl.textContent = "Enter your 6-digit pincode.";
          deb = setTimeout(() => runLookup(v), 200);
        });
      }
      if (retryBtn) {
        retryBtn.addEventListener("click", () => {
          pincodeLookupMap = null;
          pincodeLoadPromise = null;
          if (statusEl) statusEl.textContent = "Loading pincode list…";
          ensurePincodeIndex()
            .then(() => {
              if (statusEl) statusEl.textContent = "Enter your 6-digit pincode.";
              if (inp) runLookup(inp.value);
            })
            .catch(() => {
              if (statusEl) {
                statusEl.textContent = "Still unable to load. Check connection and tap Retry.";
              }
            });
        });
      }

      if (statusEl) statusEl.textContent = "Loading pincode list…";
      ensurePincodeIndex()
        .then(() => {
          if (statusEl) statusEl.textContent = "Enter your 6-digit pincode.";
          if (inp && state.answers.pincode) {
            inp.value = state.answers.pincode;
            runLookup(state.answers.pincode);
          }
        })
        .catch(() => {
          if (statusEl) {
            statusEl.textContent = "Could not load pincode list. Tap Retry.";
          }
        });
    }

      else if (mode === "quiz") bg.classList.add("bg-motion-quiz");
      else if (mode === "result") bg.classList.add("bg-motion-result");
    }

    function prefersMobileSizedAssets() {
      return (
        window.matchMedia("(max-width: 1024px)").matches &&
        !document.body.classList.contains("is-compact-landscape")
      );
    }

    function syncCompactLandscapeViewport() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const landscape = w > h;
      const shortViewport = h <= 900;
      const notWideDesktop = w <= 1440;
      document.body.classList.toggle("is-compact-landscape", landscape && shortViewport && notWideDesktop);
    }

    function getBackgroundForQuestion(question) {
      if (!question) return BG_LIBRARY.landing;
      const mobile = prefersMobileSizedAssets();
      if (mobile && BG_LIBRARY.byQuestionMobile && BG_LIBRARY.byQuestionMobile[question.id]) {
        return BG_LIBRARY.byQuestionMobile[question.id];
      }
      return BG_LIBRARY.byQuestion[question.id] || BG_LIBRARY.landing;
    }

    function getResultBackgroundUrl() {
      return prefersMobileSizedAssets() ? BG_LIBRARY.resultMobile : BG_LIBRARY.resultDesktop;
    }

    function trackEvent(eventName, payload) {
      try {
        window.dataLayer = window.dataLayer || [];
        window.dataLayer.push({
          event: eventName,
          timestamp: Date.now(),
          ...(payload || {})
        });
      } catch (err) {
        // No-op: analytics should never break the experience.
      }
    }

    function micrositeInsightsTrack(eventType, properties) {
      try {
        if (window.tracker && typeof window.tracker.track === "function") {
          window.tracker.track(eventType, properties || {}, { fire: true });
        }
      } catch (err) {
        // No-op: CDP tracker must not break the microsite.
      }
    }

    function getQuizOptionLabel(question, value) {
      if (!question || !question.options || value == null || value === "") return String(value || "");
      const hit = question.options.find((o) => o.value === value);
      return hit ? hit.label : String(value);
    }

    function updateDynamicBackground() {
      if (state.screen === "landing") {
        setBackgroundMotionMode("landing");
        setPageBackground(BG_LIBRARY.landing);
        return;
      }
      if (state.screen === "result") {
        setBackgroundMotionMode("result");
        setPageBackground(getResultBackgroundUrl());
        return;
      }
      setBackgroundMotionMode("quiz");
      const q = QUESTIONS[state.index];
      setPageBackground(getBackgroundForQuestion(q));
    }

    function warmBackgrounds() {
      const homeMobile = "https://prod-cdp-assets.rebid.co/2196/6cdc8c86-4bc8-4b42-9f0f-b416df751cf9.png";
      const urls = [
        BG_LIBRARY.fallback,
        BG_LIBRARY.landing,
        homeMobile,
        "https://prod-cdp-assets.rebid.co/2196/f955837d-379b-4d6b-9fd8-f97ff7cd323c.svg",
        "https://prod-cdp-assets.rebid.co/2196/8c4a7e52-fb95-490a-9a0b-c0e66d19533f.svg",
        BG_LIBRARY.resultDesktop,
        BG_LIBRARY.resultMobile,
        ...Object.values(BG_LIBRARY.byQuestion),
        ...Object.values(BG_LIBRARY.byQuestionMobile)
      ];
      urls.forEach((url) => { preloadImage(url); });
    }

    const quizBgViewportQuery = window.matchMedia("(max-width: 1024px)");
    function refreshQuizBackgroundOnViewportChange() {
      syncCompactLandscapeViewport();
      if (state.screen === "quiz" || state.screen === "result") updateDynamicBackground();
    }
    if (quizBgViewportQuery.addEventListener) {
      quizBgViewportQuery.addEventListener("change", refreshQuizBackgroundOnViewportChange);
    } else if (quizBgViewportQuery.addListener) {
      quizBgViewportQuery.addListener(refreshQuizBackgroundOnViewportChange);
    }
    let compactLandscapeResizeTimer = 0;
    function onOrientationOrResizeForLayout() {
      if (compactLandscapeResizeTimer) clearTimeout(compactLandscapeResizeTimer);
      compactLandscapeResizeTimer = setTimeout(() => {
        compactLandscapeResizeTimer = 0;
        syncCompactLandscapeViewport();
        if (state.screen === "quiz" || state.screen === "result") updateDynamicBackground();
      }, 60);
    }
    window.addEventListener("resize", onOrientationOrResizeForLayout);
    window.addEventListener("orientationchange", onOrientationOrResizeForLayout);

    function updateStadiumLighting(strength) {
      if (!stadiumLights) return;
      const mobile = window.matchMedia("(max-width: 1024px)").matches;
      const normalized = Math.max(0, Math.min(1, strength));
      const maxOpacity = mobile ? 0.72 : 0.94;
      const minOpacity = mobile ? 0.46 : 0.52;
      const opacity = minOpacity + normalized * (maxOpacity - minOpacity);
      const blur = mobile ? 18 - normalized * 3 : 24 - normalized * 6;
      stadiumLights.style.opacity = opacity.toFixed(2);
      stadiumLights.style.filter = "blur(" + blur.toFixed(1) + "px) saturate(" + (1 + normalized * 0.35).toFixed(2) + ")";
    }

    function updateCrowdBackgroundIntensity(strength) {
      if (!crowdBg) return;
      const mobile = window.matchMedia("(max-width: 1024px)").matches;
      const n = Math.max(0, Math.min(1, strength));
      const baseOpacity = mobile ? 0.38 : 0.48;
      const peakOpacity = mobile ? 0.58 : 0.76;
      crowdBg.style.opacity = (baseOpacity + (peakOpacity - baseOpacity) * n).toFixed(2);
      crowdBg.style.filter = "saturate(" + (0.9 + n * 0.42).toFixed(2) + ") brightness(" + (0.9 + n * 0.18).toFixed(2) + ")";
      const waveDuration = (3.05 - n * 0.95).toFixed(2) + "s";
      crowdBg.style.setProperty("--crowd-wave-duration", waveDuration);
      if (crowdRowFront) crowdRowFront.style.opacity = (0.6 + n * 0.26).toFixed(2);
      if (crowdRowMid) crowdRowMid.style.opacity = (0.38 + n * 0.22).toFixed(2);
      if (crowdRowBack) crowdRowBack.style.opacity = (0.24 + n * 0.16).toFixed(2);
    }

    function syncCrowdAtmosphere() {
      if (state.screen === "landing") {
        updateStadiumLighting(0.18);
        updateCrowdBackgroundIntensity(0.18);
        return;
      }
      if (state.screen === "quiz") {
        updateStadiumLighting(state.crowdLevel / 100);
        updateCrowdBackgroundIntensity(state.crowdLevel / 100);
        return;
      }
      if (state.screen === "result") {
        const s = computeSummary(state.answers);
        if (!state.leadUnlocked) {
          updateStadiumLighting(Math.max(0.35, state.crowdLevel / 100));
          updateCrowdBackgroundIntensity(Math.max(0.35, state.crowdLevel / 100));
          return;
        }
        const readinessScore = Math.max(
          8,
          Math.min(
            100,
            Math.round(
              (s.emiPercentHigh < 25 ? 65 : 45) +
                (s.affordabilityHigh > 5000000 ? 20 : 12) +
                (s.timelineText.includes("ready") ? 12 : 6)
            )
          )
        );
        updateStadiumLighting(Math.max(0.45, readinessScore / 100));
        updateCrowdBackgroundIntensity(Math.max(0.45, readinessScore / 100));
      }
    }

    function triggerCrowdBurst() {
      if (!crowdBg) return;
      crowdBg.classList.remove("crowd-burst");
      requestAnimationFrame(() => crowdBg.classList.add("crowd-burst"));
      setTimeout(() => crowdBg.classList.remove("crowd-burst"), 380);
    }

    function updateQuizCommentaryRail(commentary) {
      if (!quizCommentaryRail || !quizCommentaryMarquee) return;
      if (state.screen !== "quiz") {
        quizCommentaryRail.classList.add("hidden");
        delete quizCommentaryMarquee.dataset.appliedCommentary;
        return;
      }
      quizCommentaryRail.classList.remove("hidden");
      const stamp = commentary && commentary.text ? commentary.text : "";
      if (quizCommentaryMarquee.dataset.appliedCommentary === stamp) return;
      quizCommentaryMarquee.dataset.appliedCommentary = stamp;
      let raw = commentary && commentary.text ? commentary.text : "The crowd is ready and waiting for your move!";
      raw = raw.replace(/\s*Response locked\.\s*$/i, "").replace(/\s*Awaiting your call\.\s*$/i, "").trim();
      const safeText = escapeHtml(raw || "The crowd is ready and waiting for your move!");
      const mic = '<span class="qc-ref-mic" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 15a4 4 0 0 0 4-4V7a4 4 0 1 0-8 0v4a4 4 0 0 0 4 4z" stroke="currentColor" stroke-width="1.5"/><path d="M8 12v1a4 4 0 0 0 8 0v-1M12 19v2M10 21h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg></span>';
      quizCommentaryMarquee.innerHTML =
        mic +
        '<span class="qc-ref-tag">COMMENTARY</span>' +
        '<span class="qc-ref-divider" aria-hidden="true"></span>' +
        '<span class="qc-ref-msg">' + safeText + "</span>";
    }

    /** Updates selection + Next CTA without replacing #questionStage (avoids mobile scroll jump). */
    function isEmiSliderAnswerComplete() {
      const val = normalizeCurrencyInput(state.answers.emi_pref);
      return Number.isFinite(val) && val >= 0;
    }

    function refreshQuizAnsweredUI() {
      if (state.screen !== "quiz") return;
      const q = QUESTIONS[state.index];
      const answered = q.type === "city"
        ? isCityQuestionAnswerComplete()
        : q.type === "emi_slider"
        ? isEmiSliderAnswerComplete()
        : !!state.answers[q.id];
      const nextBtn = document.getElementById("nextBtn");
      if (nextBtn) nextBtn.disabled = !answered;
      if (q.type !== "city" && q.type !== "emi_slider" && questionStage) {
        questionStage.querySelectorAll(".qn-opt").forEach((node) => {
          const val = node.getAttribute("data-val");
          node.classList.toggle("selected", state.answers[q.id] === val);
        });
      }
      updateQuizCommentaryRail(getCommentarySnippet(q, answered));
      syncCrowdAtmosphere();
    }

    function renderQuestion(options) {
      const animateEntry = !(options && options.animateEntry === false);
      const q = QUESTIONS[state.index];
      updateDynamicBackground();
      const answered = q.type === "city"
        ? isCityQuestionAnswerComplete()
        : q.type === "emi_slider"
        ? isEmiSliderAnswerComplete()
        : !!state.answers[q.id];
      const em = ["🏏", "🔥", "⚡", "🎯", "🚀"];
      const phase = getPhase(state.index);
      const isSuperOver = state.index === QUESTIONS.length - 1;
      const commentary = getCommentarySnippet(q, answered);
      quizScreen.classList.remove("phase-powerplay", "phase-middle", "phase-death");
      quizScreen.classList.add("phase-" + phase);
      quizScreen.classList.toggle("super-over", isSuperOver);

      const dotsHtml = buildBallProgressDotsHtml(QUESTIONS.length, state.index);
      const ballLine = "BALL " + (state.index + 1) + " OF " + QUESTIONS.length;
      const kw = QUESTION_TITLE_KEYWORDS[q.id] || "";
      const titleHtml = formatQuestionTitleHtml(q.label, kw);
      const helperHtml = escapeHtml(q.helper);
      const nextCta = state.index === QUESTIONS.length - 1 ? "Unlock your report" : "Next ball";

      if (q.type === "city") {
        questionStage.innerHTML = `
          <article class="qn-card">
            <div class="qn-progress">
              <span class="qn-ball-of">${ballLine}</span>
              <div class="qn-dots" aria-hidden="true">${dotsHtml}</div>
            </div>
            <h2 class="qn-heading">${titleHtml}</h2>
            <p class="qn-helper">${helperHtml}</p>
            <div class="qn-city-fields">
              <div>
                <label for="cityPincode">Pincode</label>
                <input
                  id="cityPincode"
                  type="text"
                  inputmode="numeric"
                  autocomplete="postal-code"
                  maxlength="6"
                  pattern="[0-9]{6}"
                  placeholder="e.g. 400001"
                  value="${escapeHtml((state.answers.pincode && String(state.answers.pincode).replace(/\D/g, "").slice(0, 6)) || "")}"
                />
                <p class="qn-pincode-status" id="cityPincodeStatus" role="status" aria-live="polite"></p>
                <div class="qn-pincode-actions">
                  <button type="button" class="qn-pincode-retry" id="cityPincodeRetry">Retry load</button>
                </div>
                <div class="qn-pincode-multi" id="cityPincodeMulti" hidden></div>
              </div>
            </div>
            <div class="qn-nav">
              <button type="button" class="btn-q-prev" ${state.index === 0 ? "disabled" : ""} id="prevBtn"><span style="margin-top: -3px" class="btn-q-chev" aria-hidden="true">&#8249;</span> Previous ball</button>
              <button type="button" class="btn-q-next" ${!answered ? "disabled" : ""} id="nextBtn">${nextCta} <span style="margin-top: -3px" class="btn-q-chev" aria-hidden="true">&#8250;</span></button>
            </div>
            ${QUIZ_INSIGHT_HTML}
          </article>`;

        wireCityPincodeQuestion();
      } else if (q.type === "emi_slider") {
        const emiMin = Number(q.min) || 0;
        const emiMaxByIncome = getIncomeUpperBound(state.answers.income);
        const emiMax = Math.max(emiMin, Math.min(Number(q.max) || 1000000, emiMaxByIncome));
        const emiStep = Number(q.step) || 1000;
        const curEmi = Math.max(emiMin, Math.min(emiMax, normalizeCurrencyInput(state.answers[q.id] != null ? state.answers[q.id] : q.defaultValue)));
        state.answers[q.id] = curEmi;
        const emiPct = emiMax <= emiMin ? 0 : ((curEmi - emiMin) / (emiMax - emiMin)) * 100;
        questionStage.innerHTML = `
          <article class="qn-card">
            <div class="qn-progress">
              <span class="qn-ball-of">${ballLine}</span>
              <div class="qn-dots" aria-hidden="true">${dotsHtml}</div>
            </div>
            <h2 class="qn-heading">${titleHtml}</h2>
            <p class="qn-helper">${helperHtml}</p>
            <div class="qn-emi-fields">
              <div class="qn-emi-head">
                <span class="qn-emi-value" id="emiRangeValue">${formatMoneyIndian(curEmi)}</span>
              </div>
              <input
                class="slider"
                id="emiRangeInput"
                type="range"
                min="${emiMin}"
                max="${emiMax}"
                step="${emiStep}"
                value="${curEmi}"
                style="--pnb-fill-pct:${emiPct.toFixed(2)}%;"
              />
              <div class="qn-emi-input-row">
                <span class="qn-emi-input-prefix">₹</span>
                <input
                  class="qn-emi-input"
                  id="emiTextInput"
                  type="text"
                  inputmode="numeric"
                  autocomplete="off"
                  placeholder="Enter current EMI"
                  value="${Math.round(curEmi).toLocaleString("en-IN")}"
                />
              </div>
            </div>
            <div class="qn-nav">
              <button type="button" class="btn-q-prev" ${state.index === 0 ? "disabled" : ""} id="prevBtn"><span style="margin-top: -3px" class="btn-q-chev" aria-hidden="true">&#8249;</span> Previous ball</button>
              <button type="button" class="btn-q-next" ${!answered ? "disabled" : ""} id="nextBtn">${nextCta} <span style="margin-top: -3px" class="btn-q-chev" aria-hidden="true">&#8250;</span></button>
            </div>
            ${QUIZ_INSIGHT_HTML}
          </article>`;

        const rangeEl = document.getElementById("emiRangeInput");
        const textEl = document.getElementById("emiTextInput");
        const valueEl = document.getElementById("emiRangeValue");
        const syncEmiInputs = (rawValue) => {
          const num = Math.max(emiMin, Math.min(emiMax, normalizeCurrencyInput(rawValue)));
          state.answers[q.id] = num;
          if (rangeEl) {
            rangeEl.value = String(num);
            const pct = emiMax <= emiMin ? 0 : ((num - emiMin) / (emiMax - emiMin)) * 100;
            rangeEl.style.setProperty("--pnb-fill-pct", pct.toFixed(2) + "%");
          }
          if (textEl) textEl.value = Math.round(num).toLocaleString("en-IN");
          if (valueEl) valueEl.textContent = formatMoneyIndian(num);
          refreshQuizAnsweredUI();
        };
        if (rangeEl) rangeEl.addEventListener("input", () => syncEmiInputs(rangeEl.value));
        if (textEl) {
          textEl.addEventListener("input", () => syncEmiInputs(textEl.value));
          textEl.addEventListener("blur", () => syncEmiInputs(textEl.value));
        }
      } else {
        const emIcons = q.id === "stage" ? ["🏏", "🔥", "🛡️"] : em;
        const optionsHTML = q.options.map((opt, i) => {
          const shot = escapeHtml(getShotLabel(q.id, opt.value, i));
          const lbl = escapeHtml(opt.label);
          const sel = state.answers[q.id] === opt.value ? "selected" : "";
          return `<button type="button" class="qn-opt ${sel}" data-val="${opt.value}">
            <span class="qn-opt-ico" aria-hidden="true">${emIcons[i % emIcons.length]}</span>
            <span class="qn-opt-label">${lbl}</span>
            <span class="qn-opt-shot">${shot}</span>
            <span class="qn-radio" aria-hidden="true"></span>
          </button>`;
        }).join("");

        questionStage.innerHTML = `
          <article class="qn-card">
            <div class="qn-progress">
              <span class="qn-ball-of">${ballLine}</span>
              <div class="qn-dots" aria-hidden="true">${dotsHtml}</div>
            </div>
            <h2 class="qn-heading">${titleHtml}</h2>
            <p class="qn-helper">${helperHtml}</p>
            <div class="qn-options">${optionsHTML}</div>
            <div class="qn-nav">
              <button type="button" class="btn-q-prev" ${state.index === 0 ? "disabled" : ""} id="prevBtn"><span style="margin-top: -3px" class="btn-q-chev" aria-hidden="true">&#8249;</span> Previous ball</button>
              <button type="button" class="btn-q-next" ${!answered ? "disabled" : ""} id="nextBtn">${nextCta} <span style="margin-top: -3px" class="btn-q-chev" aria-hidden="true">&#8250;</span></button>
            </div>
            ${QUIZ_INSIGHT_HTML}
          </article>`;

        questionStage.querySelectorAll(".qn-opt").forEach((node) => {
          node.addEventListener("click", () => {
            state.answers[q.id] = node.getAttribute("data-val");
            playBatTap();
            refreshQuizAnsweredUI();
            /* Double rAF: iOS scrolls focused buttons inside overflow:auto ancestors; blur stops the jump when changing selection. */
            requestAnimationFrame(() => {
              requestAnimationFrame(() => {
                const a = document.activeElement;
                if (a && a.classList && a.classList.contains("qn-opt")) a.blur();
              });
            });
          });
        });
      }
      updateQuizCommentaryRail(commentary);

      const prevBtn = document.getElementById("prevBtn");
      const nextBtn = document.getElementById("nextBtn");
      if (prevBtn) {
        prevBtn.addEventListener("click", () => {
          if (state.index === 0) {
            showScreen("landing");
            return;
          }
          moveQuestion("prev", () => {
            state.index -= 1;
            renderQuestion();
          });
        });
      }
      if (nextBtn) {
        nextBtn.addEventListener("click", () => {
          const valid = q.type === "city"
            ? isCityQuestionAnswerComplete()
            : q.type === "emi_slider"
            ? isEmiSliderAnswerComplete()
            : !!state.answers[q.id];
          if (!valid) return;
          const feedback = getSelectionFeedback(q);
          trackEvent("question_answered", {
            question_id: q.id,
            answer:
              q.type === "city"
                ? String(state.answers.pincode || "") + "|" + String(state.answers.city || "")
                : state.answers[q.id],
            quality: feedback.kind
          });
          const qn = state.index + 1;
          if (q.type === "city") {
            micrositeInsightsTrack("microsite_q" + qn + "_answered", {
              question_id: q.id,
              question_index: qn,
              pincode: String(state.answers.pincode || ""),
              city: String(state.answers.city || ""),
              selected_option: String(state.answers.city || "")
            });
          } else if (q.type === "emi_slider") {
            const emiVal = normalizeCurrencyInput(state.answers[q.id]);
            micrositeInsightsTrack("microsite_q" + qn + "_answered", {
              question_id: q.id,
              question_index: qn,
              selected_option: String(emiVal),
              selected_label: formatMoneyIndian(emiVal)
            });
          } else {
            const val = state.answers[q.id];
            micrositeInsightsTrack("microsite_q" + qn + "_answered", {
              question_id: q.id,
              question_index: qn,
              selected_option: String(val || ""),
              selected_label: getQuizOptionLabel(q, val)
            });
          }
          onAnswerImpact(feedback.boost, feedback, { useLegacySfx: false });
          playNextQuestionSfx();
          if (state.index < QUESTIONS.length - 1) {
            moveQuestion("next", () => {
              state.index += 1;
              renderQuestion();
            });
          } else {
            trackEvent("quiz_completed", { total_questions: QUESTIONS.length });
            openLeadGate();
          }
        });
      }
      questionStage.classList.remove("stage-exit-next", "stage-exit-prev");
      if (animateEntry) {
        requestAnimationFrame(() => {
          questionStage.classList.remove("stage-enter");
          questionStage.classList.add("stage-enter");
          setTimeout(() => questionStage.classList.remove("stage-enter"), 450);
        });
      }
      syncCrowdAtmosphere();
    }

    function getPhase(index) {
      const over = index + 1;
      if (over <= 2) return "powerplay";
      if (over <= 5) return "middle";
      return "death";
    }

    function getPhaseCopy(phase) {
      if (phase === "powerplay") return { title: "Opening Buzz", icon: "⚡" };
      if (phase === "middle") return { title: "Strategy Zone", icon: "🧠" };
      return { title: "Final Prep Push", icon: "🔥" };
    }

    function getShotLabel(questionId, optionValue, optionIndex) {
      const perQuestion = SHOT_LABELS[questionId] || {};
      if (perQuestion[optionValue]) return perQuestion[optionValue];
      const fallback = ["Quick single", "Square drive", "Deep cover", "Late cut", "Power finish"];
      return fallback[optionIndex % fallback.length];
    }

    function getCommentarySnippet(question, answered) {
      const analystByQuestion = {
        stage: "Your game plan is the first key read.",
        city: "Market context shapes the right direction.",
        income: "Income profile sets your batting base.",
        emi_pref: "Existing obligations shape the innings plan.",
        down_payment: "Support at the crease boosts confidence.",
        tenure_pref: "Tenure comfort defines your over strategy.",
        timeline: "Timing decides your finishing momentum."
      };
      const hypeByQuestion = {
        stage: "Crowd wants a confident opening call!",
        city: "Great, now lock your home ground.",
        income: "Strong base can unlock premium shots.",
        emi_pref: "Other loan EMIs help set the right pace.",
        down_payment: "This can turn singles into boundaries.",
        tenure_pref: "Pick the over length you can sustain.",
        timeline: "Final ball energy - choose your move."
      };
      const voice = state.index % 2 === 0 ? "Analyst desk" : "Commentary box";
      const base = state.index % 2 === 0 ? analystByQuestion[question.id] : hypeByQuestion[question.id];
      const lock = answered ? " Response locked." : " Awaiting your call.";
      return { voice, text: (base || "Reading the field.") + lock };
    }

    function moveQuestion(direction, callback) {
      const cls = direction === "prev" ? "stage-exit-prev" : "stage-exit-next";
      questionStage.classList.remove("stage-exit-next", "stage-exit-prev", "stage-enter");
      questionStage.classList.add(cls);
      triggerBallTrail(direction);
      if (direction === "next") {
        quizScreen.classList.add("over-change");
        setTimeout(() => quizScreen.classList.remove("over-change"), 640);
      }
      setTimeout(callback, 320);
    }

    function triggerBallTrail(direction) {
      const wipe = document.createElement("div");
      wipe.className = "fx-ball-wipe" + (direction === "prev" ? " reverse" : "");
      wipe.innerHTML = '<span class="trail"></span><span class="ball"></span>';
      fxLayer.appendChild(wipe);
      playWhoosh(direction);
      setTimeout(() => wipe.remove(), 900);
    }

    function onAnswerImpact(boost, feedback, options) {
      const useLegacySfx = !(options && options.useLegacySfx === false);
      state.crowdLevel = Math.min(100, state.crowdLevel + boost);
      if (state.screen === "quiz") syncCrowdAtmosphere();
      if (state.screen === "quiz" && feedback && feedback.kind === "great") {
        triggerCrowdBurst();
      }
      if (useLegacySfx) {
        playBatStrike(feedback && feedback.kind === "great" ? "power" : "timed");
        if (feedback && feedback.kind === "great") {
          playCrowdRoar("big");
        } else {
          playCrowdRoar("small");
        }
      }

    function validateLeadPayload(fd, fieldMap) {
      const map = fieldMap || {
        name: "nameField",
        mobile: "mobileField",
        email: "emailField",
        city: "cityField",
        consent: "leadConsentField"
      };
      const name = String(fd.get("name") || "").trim();
      const mobile = String(fd.get("mobile") || "").trim();
      const email = String(fd.get("email") || "").trim();
      const city = String(fd.get("city") || "").trim();
      const consent = !!fd.get("consent");
      const errors = [];
      if (name.length < 2) errors.push({ field: map.name, msg: "Please enter your full name." });
      if (!/^[6-9]\d{9}$/.test(mobile)) errors.push({ field: map.mobile, msg: "Enter a valid 10-digit mobile number." });
      if (email && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) errors.push({ field: map.email, msg: "Enter a valid email address." });
      if (city.length < 2) errors.push({ field: map.city, msg: "Please enter your city." });
      if (!consent) errors.push({ field: map.consent, msg: "Please provide consent to continue." });
      return {
        valid: errors.length === 0,
        errors,
        payload: { name, mobile, email, city, consent }
      };
    }

    async function copyTextSafely(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
        return true;
      }
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "true");
      ta.style.position = "fixed";
      ta.style.top = "-9999px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      const ok = document.execCommand("copy");
      document.body.removeChild(ta);
      if (!ok) throw new Error("Copy failed");
      return true;
    }

    function ensureAudio() {
      if (!audioCtx) {
        const Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return null;
        audioCtx = new Ctx();
      }
      return audioCtx;
    }

    function playTone(freq, duration, type, gainVal) {
      if (!state.soundOn) return;
      const ctx = ensureAudio();
      if (!ctx) return;
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type || "sine";
      osc.frequency.value = freq;
      gain.gain.value = gainVal || 0.02;
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start();
      gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + duration);
      osc.stop(ctx.currentTime + duration);
    }

    function createNoiseBuffer(ctx, duration) {
      const sampleRate = ctx.sampleRate;
      const frameCount = Math.max(1, Math.floor(sampleRate * duration));
      const noiseBuffer = ctx.createBuffer(1, frameCount, sampleRate);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < frameCount; i += 1) {
        data[i] = Math.random() * 2 - 1;
      }
      return noiseBuffer;
    }

    function playFilteredNoise(filterType, freq, q, duration, peakGain) {
      if (!state.soundOn) return;
      const ctx = ensureAudio();
      if (!ctx) return;
      const now = ctx.currentTime;
      const noise = ctx.createBufferSource();
      noise.buffer = createNoiseBuffer(ctx, duration);
      const filter = ctx.createBiquadFilter();
      filter.type = filterType;
      filter.frequency.value = freq;
      filter.Q.value = q;
      const gain = ctx.createGain();
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.linearRampToValueAtTime(peakGain, now + Math.min(0.03, duration * 0.45));
      gain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      noise.connect(filter);
      filter.connect(gain);
      gain.connect(ctx.destination);
      noise.start(now);
      noise.stop(now + duration);
    }

    function playWhoosh(direction) {
      if (!state.soundOn) return;
      const ctx = ensureAudio();
      if (!ctx) return;

      const now = ctx.currentTime;
      const duration = 0.34;
      const impactAt = now + 0.26;

      // Broadband noise burst for the "air swipe" whoosh.
      const noiseBuffer = createNoiseBuffer(ctx, duration);
      const data = noiseBuffer.getChannelData(0);
      for (let i = 0; i < data.length; i += 1) data[i] *= (1 - i / data.length);
      const noise = ctx.createBufferSource();
      noise.buffer = noiseBuffer;

      const bandpass = ctx.createBiquadFilter();
      bandpass.type = "bandpass";
      bandpass.frequency.value = direction === "prev" ? 950 : 1200;
      bandpass.Q.value = 0.7;

      const whooshGain = ctx.createGain();
      whooshGain.gain.setValueAtTime(0.0001, now);
      whooshGain.gain.linearRampToValueAtTime(0.03, now + 0.03);
      whooshGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);

      noise.connect(bandpass);
      bandpass.connect(whooshGain);
      whooshGain.connect(ctx.destination);
      noise.start(now);
      noise.stop(now + duration);

      // Tiny tonal "zip" + impact tail to make transition feel premium.
      const zip = ctx.createOscillator();
      zip.type = "triangle";
      zip.frequency.setValueAtTime(direction === "prev" ? 680 : 760, now);
      zip.frequency.exponentialRampToValueAtTime(direction === "prev" ? 420 : 520, now + duration);
      const zipGain = ctx.createGain();
      zipGain.gain.setValueAtTime(0.0001, now);
      zipGain.gain.linearRampToValueAtTime(0.013, now + 0.02);
      zipGain.gain.exponentialRampToValueAtTime(0.0001, now + duration);
      zip.connect(zipGain);
      zipGain.connect(ctx.destination);
      zip.start(now);
      zip.stop(now + duration);

      const impact = ctx.createOscillator();
      impact.type = "sine";
      impact.frequency.setValueAtTime(210, impactAt);
      const impactGain = ctx.createGain();
      impactGain.gain.setValueAtTime(0.0001, impactAt);
      impactGain.gain.linearRampToValueAtTime(0.018, impactAt + 0.01);
      impactGain.gain.exponentialRampToValueAtTime(0.0001, impactAt + 0.08);
      impact.connect(impactGain);
      impactGain.connect(ctx.destination);
      impact.start(impactAt);
      impact.stop(impactAt + 0.085);
    }

    function formatMoneyIndian(num) {
      const n = Math.round(Number(num) || 0);
      if (n < 0) return "-₹" + Math.abs(n).toLocaleString("en-IN");
      return "₹" + n.toLocaleString("en-IN");
    }

    function computeSummary(answers) {
      const incomeCode = answers.income || "75_120";
      const rawExistingEmi = normalizeCurrencyInput(answers.emi_pref);
      const downCode = answers.down_payment || "5_10";
      const cityDisplay = answers.city || "your city";
      const cityMetroKey =
        answers.cityMetro ||
        (answers.city && FEEDBACK_MAP.city[answers.city] ? answers.city : "Other city");
      const tenureCode = answers.tenure_pref || "16_20";
      const timeline = answers.timeline || "exploring";

      const incomeMap = { "15_40": 30000, "40_75": 57500, "75_120": 97500, "120_250": 180000, "250_plus": 275000 };
      const downMap = { "3_5": [300000, 500000, 400000], "5_10": [500000, 1000000, 800000], "10_20": [1000000, 2000000, 1500000], "20_plus": [2000000, 3000000, 2500000] };
      const tenureMap = {
        "5_10": [60, 120, 96],
        "11_15": [132, 180, 156],
        "16_20": [192, 240, 216],
        "21_25": [252, 300, 276],
        "26_30": [312, 360, 336]
      };

      const income = incomeMap[incomeCode] || 97500;
      const existingEmi = Math.min(rawExistingEmi, income);
      const [, , downMid] = downMap[downCode] || downMap["5_10"];
      const [tenureMinMonths, tenureMaxMonths, tenureMidMonths] = tenureMap[tenureCode] || tenureMap["16_20"];

      const actualShare = income > 0 ? existingEmi / income : 0;
      let status = "Strong Consideration";
      if (actualShare <= 0.12) status = "Comfortable Ground";
      else if (actualShare >= 0.5) status = "Not Eligible Currently";
      else if (actualShare > 0.28) status = "Tight but Possible";

      const dynamicFoir = getFoirForIncome(income);
      const comfortableEmi = income * dynamicFoir - existingEmi;
      const loanCalc = calculateLoanPowerModel({
        monthlyIncome: income,
        comfortableEmi: comfortableEmi,
        existingEmi: existingEmi,
        tenureMonths: tenureMidMonths,
        roi: 8.5,
        foir: dynamicFoir
      });

      const loanAmountLow = loanCalc.eligibleLoanLow;
      const loanAmountHigh = loanCalc.eligibleLoanHigh;
      const loanAmountMid = loanCalc.eligibleLoan;
      const affordabilityLow = Math.max(0, Math.round(loanAmountLow + downMid));
      const affordabilityHigh = Math.max(0, Math.round(loanAmountHigh + downMid));
      const affordabilityMid = Math.max(0, Math.round(loanAmountMid + downMid));
      const emiDisplay = Math.max(0, loanCalc.maxEmi);

      const growthRate = cityMetroKey === "Delhi NCR" ? 0.06 : 0.055;
      const years = Math.max(10, Math.round(tenureMidMonths / 12));
      const futureValue = Math.round(affordabilityMid * Math.pow(1 + growthRate, years));
      const fvLow = Math.round(futureValue * 0.96);
      const fvHigh = Math.round(futureValue * 1.04);
      const baseRent = Math.round((affordabilityMid * 0.03) / 12);
      const monthlyRent = Math.max(20000, baseRent);
      const totalRent = Math.round(monthlyRent * 12 * ((Math.pow(1 + 0.04, years) - 1) / 0.04));

      const timelineText = timeline === "ready"
        ? "ready to step in almost immediately"
        : timeline === "3_6"
        ? "looking to bat within the next 3-6 months"
        : timeline === "6_12"
        ? "planning your innings over the next 6-12 months"
        : "still reading the pitch and exploring options";

      return {
        status,
        city: cityDisplay,
        incomeDisplay: formatMoneyIndian(income),
        emiRangeText: formatMoneyIndian(existingEmi),
        budgetDisplay: formatMoneyIndian(affordabilityMid),
        budgetRangeDisplay: formatLoanRounded(affordabilityLow) + " – " + formatLoanRounded(affordabilityHigh),
        downDisplay: downCode === "5_10" ? "₹ 8L" : formatMoneyIndian(downMid),
        preferredTenureLabel: getTenureLabel(tenureCode),
        preferredTenureMonths: tenureMidMonths,
        tenureRangeText: Math.round(tenureMinMonths / 12) + " - " + Math.round(tenureMaxMonths / 12) + " years",
        emiPercentLow: Math.round(actualShare * 100 - 2),
        emiPercentHigh: Math.round(actualShare * 100 + 1),
        affordabilityLow,
        affordabilityHigh,
        emiDisplay,
        loanAmountLow,
        loanAmountHigh,
        fvLow,
        fvHigh,
        monthlyRent,
        totalRent,
        years,
        growthRate,
        timelineText
      };
    }

    function normalizeCurrencyInput(value) {
      const num = Number(String(value || "").replace(/[^0-9.]/g, ""));
      return Number.isFinite(num) ? num : 0;
    }

    /** Trim trailing zeros after decimal for ₹ 1.40 Cr → ₹ 1.4 Cr */
    function trimInrUnitDecimal(s) {
      let t = String(s);
      if (t.indexOf(".") === -1) return t;
      return t.replace(/\.?0+$/, "");
    }

    function formatMoneyCompact(value) {
      const n = Number(value) || 0;
      const sign = n < 0 ? "-₹" : "₹";
      const abs = Math.abs(n);
      if (abs < 100000) return formatMoneyIndian(n);
      if (abs >= 10000000) {
        return sign + trimInrUnitDecimal((abs / 10000000).toFixed(2)) + "Cr";
      }
      return sign + trimInrUnitDecimal((abs / 100000).toFixed(2)) + "L";
    }

    function formatLoanRounded(value) {
      const n = Number(value) || 0;
      const sign = n < 0 ? "-₹" : "₹";
      const abs = Math.abs(n);
      if (abs < 100000) return formatMoneyIndian(n);
      if (abs >= 10000000) {
        return sign + trimInrUnitDecimal((abs / 10000000).toFixed(2)) + "Cr";
      }
      return sign + trimInrUnitDecimal((abs / 100000).toFixed(2)) + "L";
    }

    function formatLoanRange(low, high) {
      return formatLoanRounded(low) + " - " + formatLoanRounded(high);
    }

    function getEmiPreferenceMidpoint(emiPrefCode) {
      if (typeof emiPrefCode === "number") return Math.max(0, Math.round(emiPrefCode));
      const n = normalizeCurrencyInput(emiPrefCode);
      return Math.max(0, Math.round(n));
    }

    function getIncomeMidpoint(incomeCode) {
      const map = {
        "15_40": 30000,
        "40_75": 57500,
        "75_120": 97500,
        "120_250": 180000,
        "250_plus": 275000
      };
      return map[incomeCode] || 97500;
    }

        "75_120": 120000,
        "120_250": 250000,
        "250_plus": 500000

        "20_plus": 2500000
      };

    function getTenurePreferenceMonths(code) {
      const map = {
        "5_10": { min: 60, max: 120, mid: 96 },
        "11_15": { min: 132, max: 180, mid: 156 },
        "16_20": { min: 192, max: 240, mid: 216 },
        "21_25": { min: 252, max: 300, mid: 276 },
        "26_30": { min: 312, max: 360, mid: 336 }
      };
      return map[code] || map["16_20"];
    }

    function getTenureLabel(code) {
      const map = {
        "5_10": "5 - 10 Years",
        "11_15": "11 - 15 Years",
        "16_20": "16 - 20 Years",
        "21_25": "21 - 25 Years",
        "26_30": "26 - 30 Years"
      };
      return map[code] || "16 - 20 Years";
    }

    function getFoirForIncome(income) {
      const n = Math.max(0, Number(income) || 0);
      if (n < 50000) return 0.5;
      if (n < 100000) return 0.55;
      return 0.6;
    }

    function calculateLoan({
      income,
      foir,
      existingEmi = 0,
      emiPreference,
      annualRate,
      tenureMonths
    }) {
      const foirEmi = income * foir;
      const availableEmi = foirEmi - existingEmi;
      const maxEmi = emiPreference ? Math.min(availableEmi, emiPreference) : availableEmi;
      const rateFactor = annualRate / 12 / 100;
      const baseAmount = 100000;
      const emiFactor = rateFactor <= 0
        ? baseAmount / Math.max(1, tenureMonths)
        : (baseAmount * rateFactor * Math.pow(1 + rateFactor, tenureMonths)) /
          (Math.pow(1 + rateFactor, tenureMonths) - 1);
      const P = emiFactor === 0 ? 0 : (maxEmi / emiFactor) * baseAmount;
      return {
        emi: Math.round(maxEmi),
        loanAmount: Math.round(P),
        rateFactor,
        emiFactor
      };
    }

    function getLoanRange(loanAmount) {
      const variation = 0.05;
      return {
        min: Math.round(loanAmount * (1 - variation)),
        max: Math.round(loanAmount * (1 + variation))
      };
    }

    function formatINR(value) {
      return "₹ " + Number(value || 0).toLocaleString("en-IN");
    }

    function calculateLoanPowerModel(input) {
      const FOIR = Math.min(1, Math.max(0, Number(input.foir) || 0));
      const monthlyIncome = Math.max(0, Number(input.monthlyIncome) || 0);
      const comfortableEmi = Number(input.comfortableEmi) || 0;
      const existingEmi = Math.max(0, Number(input.existingEmi) || 0);
      const tenureMonths = Math.max(1, Math.round(Number(input.tenureMonths) || 1));
      const roi = Math.max(0.01, Number(input.roi) || 0.01);
      const foirEmi = Math.max(0, monthlyIncome * FOIR);
      const foirAfterObligations = foirEmi - existingEmi;

      const calc = calculateLoan({
        income: monthlyIncome,
        foir: FOIR,
        existingEmi: existingEmi,
        emiPreference: comfortableEmi,
        annualRate: roi,
        tenureMonths: tenureMonths
      });
      const loanRange = getLoanRange(calc.loanAmount);

      return {
        maxEmi: calc.emi,
        foirEmi: Math.round(foirEmi),
        foirAfterObligations: Math.round(foirAfterObligations),
        existingEmi: Math.round(existingEmi),
        comfortableEmi: Math.round(comfortableEmi),
        rateFactor: calc.rateFactor,
        emiFactor: calc.emiFactor,
        eligibleLoan: calc.loanAmount,
        eligibleLoanLow: loanRange.min,
        eligibleLoanHigh: loanRange.max,
        principal: calc.loanAmount,
        tenureMonths,
        roi,
        foir: FOIR
      };
    }

        const fanColor = palette[Math.floor(Math.random() * palette.length)];
        const fanHeight = minH + Math.random() * (maxH - minH);
        const fanWidth = minW + Math.random() * (maxW - minW);
        const fanHead = Math.max(3, Math.min(6, fanWidth * 0.5));
        p.style.setProperty("--fan-color", fanColor);
        p.style.setProperty("--fan-height", fanHeight.toFixed(1) + "px");
        p.style.setProperty("--fan-width", fanWidth.toFixed(1) + "px");
        p.style.setProperty("--fan-head", fanHead.toFixed(1) + "px");
        p.style.animationDelay = (delayBase + Math.random() * 1.8).toFixed(2) + "s";
        row.appendChild(p);
      }
    }

    function initCrowdBackground() {
      const frontTeamColors = ["#c83a36", "#d9b64a"];
      const deepTeamColors = ["#ab332f", "#b2953a"];
      buildCrowdRow("crowdRowFront", 62, frontTeamColors, 16, 30, 7, 12, 0);
      buildCrowdRow("crowdRowMid", 56, deepTeamColors, 13, 24, 6, 10, 0.18);
      buildCrowdRow("crowdRowBack", 50, deepTeamColors, 10, 18, 5, 8, 0.36);
    }

    function launchConfetti() {
      const layer = document.getElementById("confettiLayer");
      layer.innerHTML = "";
      const colors = ["#facc15", "#22d3ee", "#22c55e", "#fb923c", "#ffffff"];
      for (let i = 0; i < 90; i += 1) {
        const piece = document.createElement("span");
        piece.className = "confetti";
        piece.style.left = Math.random() * 100 + "vw";
        piece.style.background = colors[Math.floor(Math.random() * colors.length)];
        piece.style.animationDuration = 2.8 + Math.random() * 2.8 + "s";
        piece.style.animationDelay = Math.random() * 0.5 + "s";
        piece.style.transform = "rotate(" + (Math.random() * 360) + "deg)";
        layer.appendChild(piece);
      }
      setTimeout(() => { layer.innerHTML = ""; }, 5000);
    }

    function bootAppShell() {
      micrositeInsightsTrack("microsite_page_view", {
        page: "home_ground_check",
        title: document.title || "PNB Housing Home Ground Check"
      });
      syncCompactLandscapeViewport();
      initCrowdBackground();
      warmBackgrounds();
      syncCrowdAtmosphere();
    }
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", bootAppShell);
    } else {
      bootAppShell();
    }
  </script>
</body>
</html>
