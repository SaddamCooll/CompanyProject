<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Townscaper Inspired Demo</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#87CEEB;
    overflow:hidden;
    font-family:Arial, sans-serif;
}

h1{
    position:absolute;
    top:20px;
    left:20px;
    color:white;
    text-shadow:1px 1px 4px rgba(0,0,0,.4);
}

#world{
    position:absolute;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
}

.tile{
    position:absolute;
    width:60px;
    height:60px;
    transform:rotate(45deg);
    cursor:pointer;
}

.water{
    width:100%;
    height:100%;
    background:#4aa3ff;
    border:1px solid rgba(255,255,255,.25);
}

.building{
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%) rotate(-45deg);
    width:40px;
    height:80px;
    border-radius:6px 6px 0 0;
    box-shadow:0 10px 20px rgba(0,0,0,.2);
}

.building::before{
    content:"";
    position:absolute;
    top:-12px;
    left:0;
    width:40px;
    height:12px;
    background:rgba(255,255,255,.2);
    border-radius:6px 6px 0 0;
}

.info{
    position:absolute;
    bottom:20px;
    left:20px;
    color:white;
    background:rgba(0,0,0,.2);
    padding:10px 15px;
    border-radius:8px;
}
</style>
</head>
<body>

<h1>🏘️ Townscaper Mini Demo</h1>

<div id="world"></div>

<div class="info">
    Click any tile to build or remove a house.
</div>

<script>
const world = document.getElementById("world");

const rows = 10;
const cols = 10;
const tileSize = 60;

const colors = [
    "#ff6b6b",
    "#ffd93d",
    "#6bcB77",
    "#4d96ff",
    "#ff9f1c",
    "#c77dff",
    "#f28482"
];

for(let row=0; row<rows; row++){
    for(let col=0; col<cols; col++){

        const tile = document.createElement("div");
        tile.className = "tile";

        const x = (col - row) * (tileSize/2);
        const y = (col + row) * (tileSize/4);

        tile.style.left = x + "px";
        tile.style.top = y + "px";

        const water = document.createElement("div");
        water.className = "water";

        tile.appendChild(water);

        tile.addEventListener("click", () => {

            let building = tile.querySelector(".building");

            if(building){
                building.remove();
            }else{
                building = document.createElement("div");
                building.className = "building";

                const color =
                    colors[Math.floor(Math.random()*colors.length)];

                building.style.background = color;

                const height =
                    50 + Math.floor(Math.random()*80);

                building.style.height = height + "px";

                tile.appendChild(building);
            }
        });

        world.appendChild(tile);
    }
}
</script>

</body>
</html>
